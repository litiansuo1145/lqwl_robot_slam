controller_server:
  ros__parameters:
    use_sim_time: False
    controller_frequency: 20.0  # 控制器运行频率
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]

    # 进度检查
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.1
      movement_time_allowance: 30.0

    # 到达目标点精度
    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.15
      yaw_goal_tolerance: 0.2

    # MPPI 控制器
    FollowPath:
      plugin: "nav2_mppi_controller::MPPIController"
      # 预测参数
      time_steps: 50          # 预测步数 50 步
      model_dt: 0.05          # 时间步长 0.05s，预测 2.5s
      batch_size: 2000        # 采样轨迹数量
      iteration_count: 1      # 每次控制循环只迭代一次
      
      # 麦轮运动学模型
      model: Omni
      
      # 速度与加速度限制
      vx_max: 0.4
      vx_min: -0.2
      vy_max: 0.2
      vtheta_max: 1.0
      acc_lim_x: 2.0
      acc_lim_y: 1.5
      acc_lim_theta: 2.0
      
      # 采样噪声标准差
      vx_std: 0.1
      vy_std: 0.1
      vtheta_std: 0.15

      # 评价函数
      critics: ["ConstraintCritic", "GoalCritic", "GoalAngleCritic", "PathAlignCritic", "PathFollowCritic", "ObstaclesCritic"]

      # 权重分配：解决一顿一顿和犹豫不决
      ConstraintCritic:
        enabled: True
        cost_weight: 4.0

      GoalCritic:
        enabled: True
        cost_weight: 5.0
        threshold_to_consider: 1.0 # 距离终点 1m 内开始考虑目标

      GoalAngleCritic:
        enabled: True
        cost_weight: 3.0
        threshold_to_consider: 0.5

      PathAlignCritic:
        enabled: True
        cost_weight: 15.0     # 与路径对齐的重要性
        offset_from_endpoint: 2

      PathFollowCritic:
        enabled: True
        cost_weight: 15.0
        offset_from_endpoint: 5

      ObstaclesCritic:
        enabled: True
        cost_weight: 20.0
        consider_footprint: False # 是否考虑机器人足迹
        collision_cost: 1000000.0

# 其他地图参数保持一致
local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: "odom"
      robot_base_frame: "base_footprint"
      use_sim_time: False
      rolling_window: true
      width: 3
      height: 3
      resolution: 0.05
      robot_radius: 0.22
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        scan:
          topic: "/scan"
          obstacle_min_range: 0.25
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.5
        cost_scaling_factor: 10.0

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: "map"
      robot_base_frame: "base_footprint"
      use_sim_time: False
      robot_radius: 0.22
      resolution: 0.05
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        scan:
          topic: "/scan"
          obstacle_min_range: 0.25
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.5

planner_server:
  ros__parameters:
    expected_planner_frequency: 5.0
    use_sim_time: False
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.1

lifecycle_manager_navigation:
  ros__parameters:
    use_sim_time: False
    autostart: True
    node_names: ['controller_server', 'planner_server', 'behavior_server', 'bt_navigator', 'waypoint_follower', 'velocity_smoother']